[package]
name = "cpe_test"
version = "6.2.5"
edition = "2021"
description = "CPE 子网测试工具：双机自动化 ping、iperf3 与 Windows ctsTraffic 吞吐测试"
license = "MIT"
repository = "https://github.com/suikkg/cpe-test"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wait-timeout = "0.2"
libc = "0.2"
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
chrono = "0.4"
ctrlc = "3"
md5 = "0.7"
png = "0.17"
rust_xlsxwriter = { version = "0.99.0", default-features = false }
# 报告目录的打包下载。`default-features = false` 把全部压缩后端（deflate/bzip2/
# lzma/zstd/aes…）关掉，只留 store 模式——测试数据是文本和 PNG，压不压缩对内网
# 下载没有意义，而关掉之后不引入任何新的传递依赖：`rust_xlsxwriter` 本来就把
# 同一个 zip crate 编进来了，这里只是把它变成直接依赖。
zip = { version = "8.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
