name: Prepare v6.2.2 Once

on:
  push:
    branches: [feat/webui-vue]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/webui-vue
          fetch-depth: 0

      - name: Decide whether release bump is needed
        id: gate
        shell: bash
        run: |
          if grep -q '^version = "6.2.1"$' Cargo.toml; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Bump Cargo version
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text(encoding='utf-8')
          old = 'version = "6.2.1"'
          if old not in s:
              raise SystemExit('Cargo.toml is not at 6.2.1')
          p.write_text(s.replace(old, 'version = "6.2.2"', 1), encoding='utf-8')
          PY

      - name: Bump frontend version and rebuild embedded UI
        if: steps.gate.outputs.run == 'true'
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          npm version 6.2.2 --no-git-tag-version
          npm ci
          npm test
          npm run build
          npm run verify

      - name: Refresh Cargo lock and docs bundle
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.lock')
          s = p.read_text(encoding='utf-8')
          old = '[[package]]\nname = "cpe_test"\nversion = "6.2.1"'
          new = '[[package]]\nname = "cpe_test"\nversion = "6.2.2"'
          if old not in s:
              raise SystemExit('Cargo.lock cpe_test entry is not at 6.2.1')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f dist/cpe_test-v6.2.1-windows-config-docs.zip dist/cpe_test-v6.2.1-windows-config-docs.zip.sha256
          python3 dist/build_config_docs_bundle.py

      - name: Validate release tree
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          git diff --check
          grep -F 'version = "6.2.2"' Cargo.toml
          grep -F 'version = "6.2.2"' Cargo.lock
          grep -F '"version": "6.2.2"' ui/package.json
          test -f dist/cpe_test-v6.2.2-windows-config-docs.zip
          test -f dist/cpe_test-v6.2.2-windows-config-docs.zip.sha256

      - name: Commit release bump
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'release: v6.2.2'
          git push origin HEAD:feat/webui-vue
