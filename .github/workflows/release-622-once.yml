name: Prepare v6.2.2 Once

on:
  push:
    branches: [feat/webui-vue]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: prepare v6.2.2 release migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/webui-vue
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Bump versions and release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          s = cargo.read_text(encoding='utf-8')
          old = 'version = "6.2.1"'
          if old not in s:
              raise SystemExit('Cargo.toml is not at 6.2.1')
          cargo.write_text(s.replace(old, 'version = "6.2.2"', 1), encoding='utf-8')

          workflow = Path('.github/workflows/build.yml')
          s = workflow.read_text(encoding='utf-8')
          marker = '            cpe_test v6.2.1 的已验证跨平台发布包。\n\n            ## v6.2.1 WebUI 与 Agent 生命周期缺陷修复\n'
          replacement = '''            cpe_test v6.2.2 的已验证跨平台发布包.\n\n            ## v6.2.2 Ping 验收策略与 WebUI 阈值入口\n\n            - **Ping PASS 改为严格验收**：所有档位必须 0% 丢包，同时平均 RTT 与最大 RTT 都在门限内；不再以“收到过回复”或单一平均值作为通过条件。\n            - **按链路类型 × payload 自动选门限**：有线 small/medium/large 默认 Avg/Max 为 10/30、20/50、50/100 ms；Wi-Fi 为 30/80、50/100、100/200 ms。\n            - **任意 Ping 包长都能分类**：small <= 128 字节、medium <= 2000 字节，其余为 large，不再依赖固定的 32/1600/65500 三个值。\n            - **WebUI 保留高级阈值入口**：默认折叠，不增加日常操作负担；需要时可临时调整 small/medium 分界及有线/Wi-Fi 六档 Avg/Max 门限，留空继续沿用主控 config。\n            - **报告写明实际判据**：失败与达标详情都会标明有线/Wi-Fi、payload 档位以及本次实际使用的 Avg/Max 门限，避免把有线问题误写成 Wi-Fi。\n\n            ## v6.2.1 WebUI 与 Agent 生命周期缺陷修复\n'''
          if marker not in s:
              raise SystemExit('release notes marker not found')
          workflow.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Bump frontend version and rebuild embedded UI
        working-directory: ui
        shell: bash
        run: |
          set -euo pipefail
          npm version 6.2.2 --no-git-tag-version
          npm ci
          npm test
          npm run build
          npm run verify

      - name: Refresh Cargo lock and docs bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 >/dev/null
          rm -f dist/cpe_test-v6.2.1-windows-config-docs.zip dist/cpe_test-v6.2.1-windows-config-docs.zip.sha256
          python3 dist/build_config_docs_bundle.py

      - name: Validate release tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          git diff --check
          grep -F 'version = "6.2.2"' Cargo.toml
          grep -F '"version": "6.2.2"' ui/package.json
          grep -F 'cpe_test v6.2.2 的已验证跨平台发布包' .github/workflows/build.yml
          test -f dist/cpe_test-v6.2.2-windows-config-docs.zip
          test -f dist/cpe_test-v6.2.2-windows-config-docs.zip.sha256

      - name: Commit release bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'release: v6.2.2'
          git push origin HEAD:feat/webui-vue
