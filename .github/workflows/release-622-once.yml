name: Dispatch v6.2.2 Once

on:
  push:
    branches: [feat/webui-vue]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/webui-vue
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version = "6.2.2"$' Cargo.toml
          grep -q 'name = "cpe_test"' Cargo.lock
          grep -q 'version = "6.2.2"' Cargo.lock
          grep -q '"version": "6.2.2"' ui/package.json
          test -f dist/cpe_test-v6.2.2-windows-config-docs.zip
          test -f dist/cpe_test-v6.2.2-windows-config-docs.zip.sha256

      - name: Point tag at final branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa v6.2.2 -m 'Release v6.2.2' HEAD
          git push --force origin refs/tags/v6.2.2

      - name: Dispatch release workflow on tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref v6.2.2
