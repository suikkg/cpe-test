name: Apply Ping Payload Policy Once

on:
  push:
    branches: [feat/webui-vue]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/webui-vue
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 .github/scripts/apply_ping_payload_policy.py
          python3 .github/scripts/fix_ping_policy_test_fixtures.py
      - name: Build and validate UI
        run: |
          cd ui
          npm ci
          npm test -- --run
          npm run build
      - name: Format and validate Rust
        run: |
          cargo fmt
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src ui webui.html
          git commit -m "feat: classify ping RTT policy by link and payload"
          git push origin HEAD:feat/webui-vue
