name: Apply Ping Policy Once

on:
  push:
    branches: [feat/webui-vue]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage ping policy patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/webui-vue
          fetch-depth: 0

      - name: Apply Wi-Fi aware Ping acceptance policy
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found:\n{old[:300]}')
              text2 = text.replace(old, new, count)
              p.write_text(text2, encoding='utf-8')

          # Config: keep max_rtt_ms as the wired threshold for backwards compatibility;
          # add Wi-Fi-specific average and peak thresholds.
          patch('src/config.rs', '''    /// PASS 的最大 RTT 门限（ms）。Ping 还必须同时满足 0% 丢包。
              pub max_rtt_ms: f64,
          }''', '''    /// 纯有线链路 PASS 的最大 RTT 门限（ms）。Ping 还必须同时满足 0% 丢包。
              pub max_rtt_ms: f64,
              /// 任一端为 Wi-Fi 时，平均 RTT 的 PASS 门限（ms）。
              pub wifi_avg_rtt_ms: f64,
              /// 任一端为 Wi-Fi 时，单包最大 RTT 的 PASS 门限（ms）。
              pub wifi_max_rtt_ms: f64,
          }''')
          patch('src/config.rs', '''            max_rtt_ms: 20.0,
                  }
              }
          }''', '''            max_rtt_ms: 20.0,
                      wifi_avg_rtt_ms: 30.0,
                      wifi_max_rtt_ms: 100.0,
                  }
              }
          }''')
          patch('src/config.rs', '''        if !self.ping.max_rtt_ms.is_finite() || self.ping.max_rtt_ms <= 0.0 {
                      problems.push(format!(
                          "ping.max_rtt_ms={} 必须是大于 0 的有限值",
                          self.ping.max_rtt_ms
                      ));
                  }
                  problems
          ''', '''        if !self.ping.max_rtt_ms.is_finite() || self.ping.max_rtt_ms <= 0.0 {
                      problems.push(format!(
                          "ping.max_rtt_ms={} 必须是大于 0 的有限值",
                          self.ping.max_rtt_ms
                      ));
                  }
                  if !self.ping.wifi_avg_rtt_ms.is_finite() || self.ping.wifi_avg_rtt_ms <= 0.0 {
                      problems.push(format!(
                          "ping.wifi_avg_rtt_ms={} 必须是大于 0 的有限值",
                          self.ping.wifi_avg_rtt_ms
                      ));
                  }
                  if !self.ping.wifi_max_rtt_ms.is_finite() || self.ping.wifi_max_rtt_ms <= 0.0 {
                      problems.push(format!(
                          "ping.wifi_max_rtt_ms={} 必须是大于 0 的有限值",
                          self.ping.wifi_max_rtt_ms
                      ));
                  }
                  if self.ping.wifi_avg_rtt_ms > self.ping.wifi_max_rtt_ms {
                      problems.push(format!(
                          "ping.wifi_avg_rtt_ms={} 不能大于 ping.wifi_max_rtt_ms={}",
                          self.ping.wifi_avg_rtt_ms, self.ping.wifi_max_rtt_ms
                      ));
                  }
                  problems
          ''')
          patch('src/config.rs', '''        assert_eq!(c.ping.max_rtt_ms, 20.0);
          ''', '''        assert_eq!(c.ping.max_rtt_ms, 20.0);
                  assert_eq!(c.ping.wifi_avg_rtt_ms, 30.0);
                  assert_eq!(c.ping.wifi_max_rtt_ms, 100.0);
          ''')
          patch('src/config.rs', '''        assert!(ping_rtt
                      .validate()
                      .iter()
                      .any(|p| p.contains("ping.max_rtt_ms")));
          ''', '''        assert!(ping_rtt
                      .validate()
                      .iter()
                      .any(|p| p.contains("ping.max_rtt_ms")));

                  let mut wifi_ping_rtt = Config::default();
                  wifi_ping_rtt.ping.wifi_avg_rtt_ms = 101.0;
                  wifi_ping_rtt.ping.wifi_max_rtt_ms = 100.0;
                  assert!(wifi_ping_rtt
                      .validate()
                      .iter()
                      .any(|p| p.contains("wifi_avg_rtt_ms")));
          ''')

          # Ping executor: Wi-Fi uses average+peak; wired keeps the strict peak gate.
          p = Path('src/master/executor/ping_leg.rs')
          text = p.read_text(encoding='utf-8')
          start = text.index('fn ping_acceptance(')
          end = text.index('\n\nimpl Ctx', start)
          helper = r'''#[derive(Debug, Clone, Copy)]
          struct PingLatencyPolicy {
              wifi: bool,
              avg_rtt_ms: Option<f64>,
              max_rtt_ms: f64,
          }

          fn nic_looks_wifi(nic: &NicInfo) -> bool {
              if nic.is_wifi || !nic.wifi_band.trim().is_empty() {
                  return true;
              }
              // 老 agent 没有 is_wifi/wifi_band 时，serde 会把它们补成默认值；
              // 继续认角色、接口名和描述，避免升级主控后把旧辅测机的 Wi-Fi 当有线。
              let role = nic.role.to_ascii_lowercase();
              let name = nic.name.to_ascii_lowercase();
              let description = nic.description.to_ascii_lowercase();
              role.contains("wifi")
                  || name.contains("wi-fi")
                  || name.contains("wifi")
                  || name.contains("wlan")
                  || description.contains("wi-fi")
                  || description.contains("wifi")
                  || description.contains("wireless")
          }

          fn ping_latency_policy(src: &NicInfo, dst: &NicInfo, cfg: &crate::config::PingCfg) -> PingLatencyPolicy {
              let wifi = nic_looks_wifi(src) || nic_looks_wifi(dst);
              if wifi {
                  PingLatencyPolicy {
                      wifi: true,
                      avg_rtt_ms: Some(cfg.wifi_avg_rtt_ms),
                      max_rtt_ms: cfg.wifi_max_rtt_ms,
                  }
              } else {
                  PingLatencyPolicy {
                      wifi: false,
                      avg_rtt_ms: None,
                      max_rtt_ms: cfg.max_rtt_ms,
                  }
              }
          }

          fn ping_acceptance(out: &PingOut, policy: PingLatencyPolicy) -> bool {
              let avg_ok = policy.avg_rtt_ms.is_none_or(|limit| {
                  out.rtt_avg
                      .is_some_and(|rtt| rtt.is_finite() && rtt <= limit)
              });
              out.ok
                  && out.sent > 0
                  && out.received == out.sent
                  && avg_ok
                  && out
                      .rtt_max
                      .is_some_and(|rtt| rtt.is_finite() && rtt <= policy.max_rtt_ms)
          }'''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          text = text[:start] + helper + text[end:]
          text = text.replace('''        let max_rtt_ms = self.cfg.ping.max_rtt_ms;
          ''', '''        let latency_policy = ping_latency_policy(&t.src.nic, &t.dst.nic, &self.cfg.ping);
                  let max_rtt_ms = latency_policy.max_rtt_ms;
                  let avg_rtt_ms = latency_policy.avg_rtt_ms;
          ''', 1)
          text = text.replace('''        let rtt_ok = out
                      .rtt_max
                      .map(|rtt| rtt.is_finite() && rtt <= max_rtt_ms)
                      .unwrap_or(false);
                  let acceptance_ok = ping_acceptance(&out, max_rtt_ms);
          ''', '''        let avg_rtt_ok = avg_rtt_ms.is_none_or(|limit| {
                      out.rtt_avg
                          .is_some_and(|rtt| rtt.is_finite() && rtt <= limit)
                  });
                  let max_rtt_ok = out
                      .rtt_max
                      .is_some_and(|rtt| rtt.is_finite() && rtt <= max_rtt_ms);
                  let acceptance_ok = ping_acceptance(&out, latency_policy);
          ''', 1)
          text = text.replace('''        } else if out.rtt_max.is_none() {
                      format!(
                          "Ping RTT 数据缺失：收/发={}/{}, 无法按最大 RTT <= {:.1} ms 验收",
                          out.received, out.sent, max_rtt_ms
                      )
                  } else if !rtt_ok {
                      format!(
                          "Ping RTT 超限：最大 RTT={} ms，要求 <= {:.1} ms（最小/平均/最大={}/{}/{} ms）",
                          format_ping_rtt(out.rtt_max),
                          max_rtt_ms,
                          format_ping_rtt(out.rtt_min),
                          format_ping_rtt(out.rtt_avg),
                          format_ping_rtt(out.rtt_max)
                      )
                  } else {
                      format!(
                          "Ping 达标：发送/接收={}/{}，丢包率 {:.1}%，RTT 最小/平均/最大={}/{}/{} ms，最大 RTT 门限 {:.1} ms",
                          out.sent,
                          out.received,
                          out.loss_pct,
                          format_ping_rtt(out.rtt_min),
                          format_ping_rtt(out.rtt_avg),
                          format_ping_rtt(out.rtt_max),
                          max_rtt_ms
                      )
                  };
          ''', '''        } else if latency_policy.wifi && out.rtt_avg.is_none() {
                      format!(
                          "Wi-Fi Ping RTT 平均值缺失：收/发={}/{}, 无法按平均 RTT <= {:.1} ms 验收",
                          out.received,
                          out.sent,
                          avg_rtt_ms.unwrap_or_default()
                      )
                  } else if out.rtt_max.is_none() {
                      format!(
                          "Ping RTT 最大值缺失：收/发={}/{}, 无法按最大 RTT <= {:.1} ms 验收",
                          out.received, out.sent, max_rtt_ms
                      )
                  } else if !avg_rtt_ok {
                      format!(
                          "Wi-Fi Ping 平均 RTT 超限：平均 RTT={} ms，要求 <= {:.1} ms；最大 RTT={} ms（上限 {:.1} ms）",
                          format_ping_rtt(out.rtt_avg),
                          avg_rtt_ms.unwrap_or_default(),
                          format_ping_rtt(out.rtt_max),
                          max_rtt_ms
                      )
                  } else if !max_rtt_ok {
                      format!(
                          "Ping RTT 峰值超限：最大 RTT={} ms，要求 <= {:.1} ms（最小/平均/最大={}/{}/{} ms）",
                          format_ping_rtt(out.rtt_max),
                          max_rtt_ms,
                          format_ping_rtt(out.rtt_min),
                          format_ping_rtt(out.rtt_avg),
                          format_ping_rtt(out.rtt_max)
                      )
                  } else if latency_policy.wifi {
                      format!(
                          "Wi-Fi Ping 达标：发送/接收={}/{}，丢包率 {:.1}%，RTT 最小/平均/最大={}/{}/{} ms；平均 <= {:.1} ms 且最大 <= {:.1} ms",
                          out.sent,
                          out.received,
                          out.loss_pct,
                          format_ping_rtt(out.rtt_min),
                          format_ping_rtt(out.rtt_avg),
                          format_ping_rtt(out.rtt_max),
                          avg_rtt_ms.unwrap_or_default(),
                          max_rtt_ms
                      )
                  } else {
                      format!(
                          "有线 Ping 达标：发送/接收={}/{}，丢包率 {:.1}%，RTT 最小/平均/最大={}/{}/{} ms；最大 RTT <= {:.1} ms",
                          out.sent,
                          out.received,
                          out.loss_pct,
                          format_ping_rtt(out.rtt_min),
                          format_ping_rtt(out.rtt_avg),
                          format_ping_rtt(out.rtt_max),
                          max_rtt_ms
                      )
                  };
          ''', 1)
          text = text.replace('''            PingPurpose::SubnetTest => {
                          format!("子网PING（0% 丢包且最大 RTT <= {max_rtt_ms:.0}ms）")
                      }
          ''', '''            PingPurpose::SubnetTest if latency_policy.wifi => format!(
                          "子网PING（Wi-Fi：0% 丢包，平均 RTT <= {:.0}ms，最大 RTT <= {:.0}ms）",
                          avg_rtt_ms.unwrap_or_default(),
                          max_rtt_ms
                      ),
                      PingPurpose::SubnetTest => {
                          format!("子网PING（有线：0% 丢包且最大 RTT <= {max_rtt_ms:.0}ms）")
                      }
          ''', 1)
          test_mod = r'''

          #[cfg(test)]
          mod tests {
              use super::*;

              fn out(received: u32, avg: Option<f64>, max: Option<f64>) -> PingOut {
                  PingOut {
                      ok: received > 0,
                      sent: 180,
                      received,
                      lost: 180 - received,
                      loss_pct: (180 - received) as f64 / 1.8,
                      rtt_min: Some(2.0),
                      rtt_avg: avg,
                      rtt_max: max,
                      ..Default::default()
                  }
              }

              #[test]
              fn wired_ping_uses_the_strict_peak_gate() {
                  let cfg = crate::config::PingCfg::default();
                  let nic = NicInfo::default();
                  let policy = ping_latency_policy(&nic, &nic, &cfg);
                  assert!(!policy.wifi);
                  assert!(ping_acceptance(&out(180, Some(5.0), Some(20.0)), policy));
                  assert!(!ping_acceptance(&out(180, Some(5.0), Some(20.1)), policy));
              }

              #[test]
              fn wifi_ping_requires_zero_loss_good_average_and_a_bounded_spike() {
                  let cfg = crate::config::PingCfg::default();
                  let wifi = NicInfo { is_wifi: true, ..Default::default() };
                  let wired = NicInfo::default();
                  let policy = ping_latency_policy(&wifi, &wired, &cfg);
                  assert!(policy.wifi);
                  assert!(ping_acceptance(&out(180, Some(30.0), Some(100.0)), policy));
                  assert!(!ping_acceptance(&out(179, Some(5.0), Some(10.0)), policy));
                  assert!(!ping_acceptance(&out(180, Some(30.1), Some(80.0)), policy));
                  assert!(!ping_acceptance(&out(180, Some(10.0), Some(100.1)), policy));
                  assert!(!ping_acceptance(&out(180, None, Some(20.0)), policy));
              }

              #[test]
              fn old_agent_wifi_metadata_is_still_recognized() {
                  for nic in [
                      NicInfo { role: "WIFI5G".into(), ..Default::default() },
                      NicInfo { name: "WLAN 3".into(), ..Default::default() },
                      NicInfo { description: "Intel Wireless Adapter".into(), ..Default::default() },
                  ] {
                      assert!(nic_looks_wifi(&nic), "旧 agent 的 Wi-Fi 不该被当成有线: {nic:?}");
                  }
              }
          }
          '''
          test_mod = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_mod.splitlines())
          if '#[cfg(test)]\nmod tests {' not in text:
              text += test_mod
          p.write_text(text, encoding='utf-8')

          # Bootstrap advertises the automatic Wi-Fi thresholds; only the wired max remains run-overridable.
          patch('src/master/webui/model.rs', '''    pub(super) ping_max_rtt_ms: f64,
              pub(super) screenshot: bool,
          ''', '''    pub(super) ping_max_rtt_ms: f64,
              pub(super) ping_wifi_avg_rtt_ms: f64,
              pub(super) ping_wifi_max_rtt_ms: f64,
              pub(super) screenshot: bool,
          ''')
          patch('src/master/webui/api.rs', '''        ping_max_rtt_ms: state.cfg.ping.max_rtt_ms,
                  screenshot: state.cfg.screenshot,
          ''', '''        ping_max_rtt_ms: state.cfg.ping.max_rtt_ms,
                  ping_wifi_avg_rtt_ms: state.cfg.ping.wifi_avg_rtt_ms,
                  ping_wifi_max_rtt_ms: state.cfg.ping.wifi_max_rtt_ms,
                  screenshot: state.cfg.screenshot,
          ''')
          patch('ui/src/api/dto.ts', '''  ping_max_rtt_ms: number;
            screenshot: boolean;
          ''', '''  ping_max_rtt_ms: number;
            ping_wifi_avg_rtt_ms: number;
            ping_wifi_max_rtt_ms: number;
            screenshot: boolean;
          ''')

          # Frontend: make it explicit that the editable max is wired-only; Wi-Fi policy is automatic.
          patch('ui/src/views/run/GlobalDefaults.vue', '''        <span>Ping 最大 RTT（ms）</span>
          ''', '''        <span>有线 Ping 最大 RTT（ms）</span>
          ''')
          patch('ui/src/views/run/GlobalDefaults.vue', '''      <strong>Ping PASS = 0% 丢包 + 最大 RTT 不超过门限</strong>；RTT 数据缺失同样不通过。
          ''', '''      <strong>Ping 一律要求 0% 丢包</strong>；纯有线链路按最大 RTT 门限验收。
              只要任一端是 Wi-Fi，就自动改用<strong>平均 RTT ≤ {{ configured?.ping_wifi_avg_rtt_ms ?? 30 }} ms + 最大 RTT ≤ {{ configured?.ping_wifi_max_rtt_ms ?? 100 }} ms</strong>，
              允许空口偶发抖动，但不会让一次严重尖峰被平均值掩盖；所需 RTT 数据缺失同样不通过。
          ''')

          # Existing branch already added RunRequest.ping_max_rtt_ms; fix the two hand-written test literals
          # that the previous CI exposed as missing-field compile errors.
          p = Path('src/master/webui/tests.rs')
          text = p.read_text(encoding='utf-8')
          needle = '        ping_payload_sizes: Vec::new(),\n        limit_udp_by_link_speed: false,'
          if needle not in text:
              raise SystemExit('tests.rs: first RunRequest literal not found')
          text = text.replace(needle, '        ping_payload_sizes: Vec::new(),\n        ping_max_rtt_ms: 0.0,\n        limit_udp_by_link_speed: false,', 1)
          needle2 = '        ping_payload_sizes: numbers(&settings["ping_payload_sizes"]),\n        limit_udp_by_link_speed:'
          if needle2 not in text:
              raise SystemExit('tests.rs: import RunRequest literal not found')
          text = text.replace(needle2, '        ping_payload_sizes: numbers(&settings["ping_payload_sizes"]),\n        ping_max_rtt_ms: settings["ping_max_rtt_ms"].as_f64().unwrap_or(0.0),\n        limit_udp_by_link_speed:', 1)
          p.write_text(text, encoding='utf-8')

      - name: Format Rust
        run: cargo fmt

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.rs src/master/executor/ping_leg.rs src/master/webui/model.rs src/master/webui/api.rs src/master/webui/tests.rs ui/src/api/dto.ts ui/src/views/run/GlobalDefaults.vue
          git commit -m 'feat: use wifi-aware ping latency policy'
          git push origin HEAD:feat/webui-vue
