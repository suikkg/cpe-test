name: Build Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CTSTRAFFIC_VERSION: "2.0.4.0"
  CTSTRAFFIC_COMMIT: "4468b8085b6ac58c531596216f10e812287174ea"
  CTSTRAFFIC_SHA256: "9ac0f6a19da355343133f658c6e5d0dc40919f9a13020f86621194c31ce20b12"

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest
    outputs:
      crate_version: ${{ steps.metadata.outputs.crate_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve Cargo version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "cpe_test"))')"
          echo "crate_version=${crate_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          crate_version="${{ steps.metadata.outputs.crate_version }}"
          expected_tag="v${crate_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version ${crate_version}" >&2
            exit 1
          fi

      - name: Verify release tag points to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse 'origin/main^{commit}')"
          tag_sha="$(git rev-parse '${{ github.sha }}^{commit}')"
          if [[ "${tag_sha}" != "${main_sha}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} points to ${tag_sha}, but origin/main points to ${main_sha}" >&2
            echo "formal releases must be tagged from the current main branch HEAD" >&2
            exit 1
          fi

      - name: Validate JSON configuration files
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import glob, json; files = ["config.example.json", "config.minimal.json", *sorted(glob.glob("dist/configs/*.json"))]; [json.load(open(path, encoding="utf-8")) for path in files]; print(f"validated {len(files)} JSON files")'

      - name: Validate tracked Windows configuration and documentation bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          bundle = Path("dist/cpe_test-v4.4.0-windows-config-docs.zip")
          checksum = Path(f"{bundle}.sha256")
          expected_hash = checksum.read_text(encoding="utf-8").split()[0]
          actual_hash = sha256(bundle.read_bytes()).hexdigest()
          if actual_hash != expected_hash:
              raise SystemExit(f"bundle SHA-256 mismatch: {actual_hash}")

          prefix = "cpe_test-v4.4.0-windows-config-docs"
          source_for = {
              "Windows配置与文档包说明.md": Path("dist/Windows配置与文档包说明.md"),
              "README.md": Path("README.md"),
              "README-Windows-快速开始.md": Path("dist/README-Windows-快速开始.md"),
              "使用说明.md": Path("使用说明.md"),
              "NIC_README.md": Path("NIC_README.md"),
              "UDP并发灌包验收场景.md": Path("UDP并发灌包验收场景.md"),
              "config.minimal.json": Path("config.minimal.json"),
              "config.example.json": Path("config.example.json"),
              "configs/config-sgmii.json": Path("dist/configs/config-sgmii.json"),
              "configs/config-wifi5g.json": Path("dist/configs/config-wifi5g.json"),
              "configs/config-10gusb.json": Path("dist/configs/config-10gusb.json"),
              "configs/config-all-common.json": Path("dist/configs/config-all-common.json"),
              "start_ui.bat": Path("dist/start_ui.bat"),
              "start_agent.bat": Path("dist/start_agent.bat"),
              "start_master.bat": Path("dist/start_master.bat"),
              "start_master_select_config.bat": Path("dist/start_master_select_config.bat"),
              "iperf3-请放到这里.txt": Path("dist/iperf3-请放到这里.txt"),
              "ctsTraffic-请放到这里.txt": Path("dist/ctsTraffic-请放到这里.txt"),
              "LICENSE-cpe_test-MIT.txt": Path("LICENSE"),
              "THIRD_PARTY_NOTICES.md": Path("THIRD_PARTY_NOTICES.md"),
          }
          expected_names = {f"{prefix}/{relative}" for relative in source_for}
          with ZipFile(bundle) as archive:
              archive.testzip()
              actual_names = {info.filename for info in archive.infolist() if not info.is_dir()}
              if actual_names != expected_names:
                  missing = sorted(expected_names - actual_names)
                  extra = sorted(actual_names - expected_names)
                  raise SystemExit(f"bundle entries mismatch; missing={missing}, extra={extra}")
              for relative, source in source_for.items():
                  info = archive.getinfo(f"{prefix}/{relative}")
                  if not info.filename.isascii() and not info.flag_bits & 0x800:
                      raise SystemExit(f"ZIP entry is not marked UTF-8: {info.filename}")
                  if archive.read(info) != source.read_bytes():
                      raise SystemExit(f"bundle entry is stale: {relative}")
          print(f"validated {len(source_for)} Windows config/document bundle files")
          PY

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: .exe
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve package name
        id: package
        shell: bash
        run: |
          set -euo pipefail
          crate_version="${{ needs.quality.outputs.crate_version }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME}"
          else
            release_version="v${crate_version}"
          fi
          if [[ "${release_version}" != "v${crate_version}" ]]; then
            echo "release version ${release_version} does not match Cargo version ${crate_version}" >&2
            exit 1
          fi
          asset_base="cpe_test-${release_version}-${{ matrix.platform }}"
          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "asset_base=${asset_base}" >> "${GITHUB_OUTPUT}"

      - name: Validate JSON configuration files on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @((Resolve-Path 'config.example.json').Path)
          $files += (Get-ChildItem 'dist/configs/*.json').FullName
          foreach ($file in $files) {
            Get-Content -LiteralPath $file -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
            Write-Host "validated $file"
          }

      - name: Test on Windows
        if: matrix.platform == 'windows-x86_64'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Native help smoke test
        if: matrix.platform != 'macos-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/cpe_test${{ matrix.ext }}"
          help_output="$("${binary}" --help 2>&1)"
          printf '%s\n' "${help_output}"
          grep -F "v${{ needs.quality.outputs.crate_version }}" <<<"${help_output}"

      - name: Verify macOS binary architecture
        if: matrix.platform == 'macos-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          file "target/${{ matrix.target }}/release/cpe_test" | grep -F 'arm64'

      - name: Verify Linux binary architecture
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: file "target/${{ matrix.target }}/release/cpe_test" | grep -F 'x86-64'

      - name: Download and verify pinned ctsTraffic
        id: ctstraffic
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PinnedFile {
            param(
              [Parameter(Mandatory = $true)][string]$Uri,
              [Parameter(Mandatory = $true)][string]$OutFile
            )
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing
                return
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Warning "download attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }

          $downloadDir = Join-Path $env:RUNNER_TEMP 'ctstraffic-pinned'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          $binary = Join-Path $downloadDir 'ctsTraffic.exe'
          $license = Join-Path $downloadDir 'LICENSE-ctsTraffic-Apache-2.0.txt'
          $baseUrl = "https://raw.githubusercontent.com/microsoft/ctsTraffic/$env:CTSTRAFFIC_COMMIT"
          # 自托管兜底：上游仓库删档/改历史/临时不可达时，回退到本仓库自己发布过的
          # 同一份二进制。两条路径下载完都要过同一个 SHA-256 门槛，所以镜像不会
          # 降低可信度——它只是让发布链路不再单点依赖上游。
          $mirrorUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/ctstraffic-mirror-$env:CTSTRAFFIC_VERSION"

          $sources = @(
            @{ Name = 'upstream'; Binary = "$baseUrl/Releases/$env:CTSTRAFFIC_VERSION/x64/ctsTraffic.exe"; License = "$baseUrl/LICENSE" },
            @{ Name = 'self-hosted mirror'; Binary = "$mirrorUrl/ctsTraffic.exe"; License = "$mirrorUrl/LICENSE-ctsTraffic-Apache-2.0.txt" }
          )

          $fetched = $false
          foreach ($source in $sources) {
            try {
              Get-PinnedFile -Uri $source.Binary -OutFile $binary
              Get-PinnedFile -Uri $source.License -OutFile $license
              Write-Host "fetched ctsTraffic from $($source.Name)"
              $fetched = $true
              break
            } catch {
              Write-Warning "ctsTraffic source '$($source.Name)' unavailable: $($_.Exception.Message)"
            }
          }
          if (-not $fetched) {
            throw 'ctsTraffic unavailable from both upstream and the self-hosted mirror'
          }

          $actualHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:CTSTRAFFIC_SHA256) {
            throw "ctsTraffic SHA-256 mismatch: expected $env:CTSTRAFFIC_SHA256, got $actualHash"
          }
          $licenseText = Get-Content -LiteralPath $license -Raw -Encoding UTF8
          if ($licenseText -notmatch 'Apache License\s+Version 2\.0') {
            throw 'downloaded ctsTraffic license is not the expected Apache-2.0 text'
          }

          "binary=$binary" >> $env:GITHUB_OUTPUT
          "license=$license" >> $env:GITHUB_OUTPUT
          Write-Host "verified ctsTraffic $env:CTSTRAFFIC_VERSION ($actualHash)"

      - name: ctsTraffic help smoke test
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = '${{ steps.ctstraffic.outputs.binary }}'
          $stdout = Join-Path $env:RUNNER_TEMP 'ctstraffic-help.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ctstraffic-help.stderr.txt'
          $process = Start-Process -FilePath $binary -ArgumentList '-Help' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $helpText = (Get-Content -LiteralPath $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue)
          if (@(0, 13) -notcontains $process.ExitCode) {
            throw "ctsTraffic -Help returned unexpected exit code $($process.ExitCode)"
          }
          if ($helpText -notmatch 'ctsTraffic') {
            throw 'ctsTraffic -Help output did not identify ctsTraffic'
          }
          Write-Host "ctsTraffic -Help smoke test passed with expected exit code $($process.ExitCode)"

      - name: Package Windows release
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetBase = '${{ steps.package.outputs.asset_base }}'
          $outDir = Join-Path $PWD 'release-packages'
          $stage = Join-Path $env:RUNNER_TEMP $assetBase
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item 'target/${{ matrix.target }}/release/cpe_test.exe' (Join-Path $stage 'cpe_test.exe')
          Copy-Item 'dist/README-Windows-快速开始.md' $stage
          Copy-Item 'dist/start_ui.bat' $stage
          Copy-Item 'dist/start_agent.bat' $stage
          Copy-Item 'dist/start_master.bat' $stage
          Copy-Item 'dist/start_master_select_config.bat' $stage
          Copy-Item 'dist/iperf3-请放到这里.txt' $stage
          Copy-Item 'dist/ctsTraffic-请放到这里.txt' $stage
          Copy-Item 'dist/configs' (Join-Path $stage 'configs') -Recurse
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE-cpe_test-MIT.txt')
          Copy-Item 'THIRD_PARTY_NOTICES.md' $stage
          Copy-Item 'third_party/WIL-LICENSE-MIT.txt' (Join-Path $stage 'LICENSE-WIL-MIT.txt')
          Copy-Item '${{ steps.ctstraffic.outputs.binary }}' (Join-Path $stage 'ctsTraffic.exe')
          Copy-Item '${{ steps.ctstraffic.outputs.license }}' $stage

          $required = @(
            'cpe_test.exe',
            'ctsTraffic.exe',
            'README-Windows-快速开始.md',
            'start_ui.bat',
            'start_agent.bat',
            'start_master.bat',
            'start_master_select_config.bat',
            'iperf3-请放到这里.txt',
            'ctsTraffic-请放到这里.txt',
            'configs/config-sgmii.json',
            'configs/config-wifi5g.json',
            'configs/config-10gusb.json',
            'configs/config-all-common.json',
            'LICENSE-cpe_test-MIT.txt',
            'LICENSE-ctsTraffic-Apache-2.0.txt',
            'LICENSE-WIL-MIT.txt',
            'THIRD_PARTY_NOTICES.md'
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $stage $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows package is missing required file: $relativePath"
            }
          }

          $packagedCtsHash = (Get-FileHash -LiteralPath (Join-Path $stage 'ctsTraffic.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packagedCtsHash -ne $env:CTSTRAFFIC_SHA256) {
            throw "packaged ctsTraffic SHA-256 mismatch: $packagedCtsHash"
          }

          function Assert-PeX64 {
            param([Parameter(Mandatory = $true)][string]$Path)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64) { throw "PE file is too small: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
              throw "invalid PE header offset: $Path"
            }
            $signature = [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($signature -ne "PE`0`0" -or $machine -ne 0x8664) {
              throw ('expected PE32+ x86-64: {0}; signature={1}; machine=0x{2:x4}' -f $Path, $signature, $machine)
            }
          }
          Assert-PeX64 (Join-Path $stage 'cpe_test.exe')
          Assert-PeX64 (Join-Path $stage 'ctsTraffic.exe')

          $archive = Join-Path $outDir "$assetBase.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          Write-Host "created $archive"

      - name: Package Unix release
        if: matrix.platform != 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          asset_base="${{ steps.package.outputs.asset_base }}"
          out_dir="${PWD}/release-packages"
          stage="${RUNNER_TEMP}/${asset_base}"
          mkdir -p "${out_dir}" "${stage}"
          install -m 0755 "target/${{ matrix.target }}/release/cpe_test" "${stage}/cpe_test"
          install -m 0644 README.md "${stage}/README.md"
          install -m 0644 LICENSE "${stage}/LICENSE"
          install -m 0644 THIRD_PARTY_NOTICES.md "${stage}/THIRD_PARTY_NOTICES.md"
          tar -czf "${out_dir}/${asset_base}.tar.gz" -C "${stage}" .
          tar -tzf "${out_dir}/${asset_base}.tar.gz" | grep -Fx './cpe_test'

      - name: Upload packaged release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset_base }}
          path: release-packages/${{ steps.package.outputs.asset_base }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify archives and create SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          windows="cpe_test-${version}-windows-x86_64.zip"
          macos="cpe_test-${version}-macos-aarch64.tar.gz"
          linux="cpe_test-${version}-linux-x86_64.tar.gz"
          expected=("${windows}" "${macos}" "${linux}")

          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#actual[@]}" -ne 3 ]]; then
            printf 'expected exactly 3 packaged assets, found %s:\n' "${#actual[@]}" >&2
            printf '  %s\n' "${actual[@]}" >&2
            exit 1
          fi
          for asset in "${expected[@]}"; do
            if [[ ! -f "release-assets/${asset}" ]]; then
              echo "missing packaged asset: ${asset}" >&2
              exit 1
            fi
          done

          verify_dir="$(mktemp -d)"
          WINDOWS_ARCHIVE="release-assets/${windows}" VERIFY_DIR="${verify_dir}" python3 - <<'PY'
          from hashlib import sha256
          from os import environ
          from pathlib import Path
          from zipfile import ZipFile

          archive_path = Path(environ["WINDOWS_ARCHIVE"])
          verify_dir = Path(environ["VERIFY_DIR"])
          required = {
              "cpe_test.exe",
              "ctsTraffic.exe",
              "README-Windows-快速开始.md",
              "start_ui.bat",
              "start_agent.bat",
              "start_master.bat",
              "start_master_select_config.bat",
              "iperf3-请放到这里.txt",
              "ctsTraffic-请放到这里.txt",
              "configs/config-sgmii.json",
              "configs/config-wifi5g.json",
              "configs/config-10gusb.json",
              "configs/config-all-common.json",
              "LICENSE-cpe_test-MIT.txt",
              "LICENSE-ctsTraffic-Apache-2.0.txt",
              "LICENSE-WIL-MIT.txt",
              "THIRD_PARTY_NOTICES.md",
          }
          with ZipFile(archive_path) as archive:
              corrupt = archive.testzip()
              if corrupt is not None:
                  raise SystemExit(f"Windows archive contains a corrupt entry: {corrupt}")
              entries = [info.filename for info in archive.infolist() if not info.is_dir()]
              if len(entries) != len(set(entries)):
                  raise SystemExit("Windows archive contains duplicate file entries")
              missing = sorted(required - set(entries))
              if missing:
                  raise SystemExit(f"Windows archive is missing required files: {missing}")
              for name in required:
                  info = archive.getinfo(name)
                  if not name.isascii() and not info.flag_bits & 0x800:
                      raise SystemExit(f"Windows ZIP entry is not marked UTF-8: {name}")
              cts = archive.read("ctsTraffic.exe")
              actual_cts_hash = sha256(cts).hexdigest()
              if actual_cts_hash != environ["CTSTRAFFIC_SHA256"]:
                  raise SystemExit(
                      "published Windows archive contains unexpected ctsTraffic hash: "
                      f"{actual_cts_hash}"
                  )
              (verify_dir / "cpe_test.exe").write_bytes(archive.read("cpe_test.exe"))
              (verify_dir / "ctsTraffic.exe").write_bytes(cts)
          PY
          tar -xOzf "release-assets/${macos}" ./cpe_test > "${verify_dir}/cpe_test-macos"
          tar -xOzf "release-assets/${linux}" ./cpe_test > "${verify_dir}/cpe_test-linux"
          file "${verify_dir}/cpe_test.exe" | grep -E 'PE32\+.*x86-64'
          file "${verify_dir}/ctsTraffic.exe" | grep -E 'PE32\+.*x86-64'
          file "${verify_dir}/cpe_test-macos" | grep -E 'Mach-O.*arm64'
          file "${verify_dir}/cpe_test-linux" | grep -E 'ELF 64-bit.*x86-64'
          for archive in "${macos}" "${linux}"; do
            if ! tar -tzf "release-assets/${archive}" | grep -Fx './cpe_test' >/dev/null; then
              echo "Unix archive is missing cpe_test: ${archive}" >&2
              exit 1
            fi
            if ! tar -tvzf "release-assets/${archive}" | grep -E '^-rwx[^ ]* .*\./cpe_test$' >/dev/null; then
              echo "Unix archive does not preserve the cpe_test executable bit: ${archive}" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            cpe_test ${{ github.ref_name }} 的已验证跨平台发布包。

            ## v4.4.0 双向门限、控制台监控与一批生命周期修复

            - **按配对的双向门限**：测试矩阵每行新增「双向门限 A→B / B→A」，只在勾了「双向」时生效。半双工介质（Wi-Fi、部分 USB 网卡）双向并发时两个方向抢同一段介质时间，拿单向门限去卡双向必然判 `RATE_FAIL`。**按配对而不是按网卡**——同一块 RNDIS 口和 Wi-Fi 组双向、和 SGMII 组双向能收到的速率不是一个量级。配置字段 `rate_targets_bidir_mbps`，只收绝对 Mbps；填了却没勾「双向」会当场报错。
            - **控制台新增监控标签页**：本机或辅测机任一网卡的实时 RX/TX 曲线，与测试并发。横轴是时间而不是采样序号，断流会在图上留出空档。另新增「本机」区（不必先连辅测机）、PING 进测试矩阵、resume 勾选框。
            - **两个 Web UI 可改绑定地址**：新增 `--ui-bind`。主控控制台放到非回环地址**必须**同时给 `--ui-token`，否则拒绝启动；两个 token 都支持环境变量。
            - **修复控制台在 macOS/Linux 上 Ctrl+C 杀不掉**：`run_master()` 装的取消处理器只置标志不退进程且永不撤销，而取请求循环从不查那个标志。现在空闲时按一次即退；测试在跑时先优雅收尾出报告再退。
            - **修复辅测机上的 UI 监控最长空转两小时**：租约改为从最后一次 `/monitor/status` 起算的心跳，UI 侧 7200s → 180s；监控错误列表封顶并保留准确计数。
            - **修复 iperf3 Byte 单位进制**：bit 单位按 1000 进位、Byte 单位按 1024（实测 100 Mbits/sec 打印成 11.9 MBytes/sec），此前 `-f M` 下低报 4.6%。
            - **客户端给响应体加了上限**：`Content-Length` 此前直接进 `Vec::resize`，对端说多大就申请多大。现与 agent 的 `MAX_BODY` 一致封在 100MB，chunked 走累计预算，另加总时限；连接不再只试解析出的第一个地址。
            - **`RX_DROPOUT` 补进处置建议与指标交叉核对**，并新增编译期扫描测试防止后续原因码再次漏登记；删除已无产出点的 `UNSTABLE` 分级及报告里恒为 0 的那格统计。
            - **非中英文 Windows 上不再扫不到网卡**：补德语 `-Adapter` 写法，并用 `GetIfTable2` 的接口别名做语言无关兜底。
            - **回归覆盖**：单元测试 417 → 452。

            ## v4.3.1 判定收紧、Wi-Fi 2.4G 上限与辅测机状态页

            - **接收速率判定改为「每个 5 秒窗口都要达标」**：平均与 P10 均达标但任一完整 5 秒滚动窗口掉到门限以下时判 `RATE_FAIL / RX_DROPOUT`，写明掉了几个窗口、最低多少、最长连续多少秒；掉到接近 0 报「断流」。TCP 与 UDP 共用同一个 `rx_dropout` 谓词。`UNSTABLE` 不再产出。
            - **Wi-Fi 2.4G 不再借用 5G 的负载上限**：新增 `wifi_24g_payload_ceiling_mbps`（默认 300）；此前 2.4G 与 5G/6G 共用 2800，等于对 2.4G 口完全不裁剪。频段未识别的 `WIFI` 仍按 5G 档。
            - **修复控制台生成重复测试单元**：`-b` 是否被按网口覆盖改为逐方向判断；此前按整对判断会把被钉死的那个方向原样复制 N 份。
            - **新增辅测机状态页**：`cpe_test agent` 在 `127.0.0.1:28802` 起只读页面（`--ui-port` / `--no-ui`），显示运行状态、本机网卡与实时活动（重复轮询折叠成 ×N，token 错误显示为失败记录）。
            - **控制台参数补齐**：UDP `-l` / `-w` 多档（与 `-b` 取组合，留空则不下发）、按网口的 UDP `-l`、RX 门限支持 `90%` 协商速率百分比、「按链路上限裁剪 UDP -b」开关（默认不裁剪）、「网段前缀」输入框。
            - **测试矩阵整列开关**：方向 / 协议 / IP 三列表头可一键全开或全关，「全选」连双向和 IPv6 一起勾。
            - **回归覆盖**：单元测试 379 → 406。

            ## v4.3.0 Windows 实测修复与本地图形控制台

            - **新增本地图形控制台**：`cpe_test ui` / `start_ui.bat` 只监听 `127.0.0.1`，可连接辅测机、按网口设置 RX 门限和 UDP `-b`、勾选网口组合/方向/协议/IP 版本，并扫描 TCP `-w` / `-P` 与 UDP `-b` 多档参数。支持任务预览、配置下载、实时进度、优雅结束和打开报告；执行仍统一调用 `run_master()`。
            - **修复双向 UDP 判定互相污染**：有效窗口改为逐腿计算，一条腿失败不再清空另一条腿已经测得的网卡 RX；两腿是否真正并发作为独立事实写入原因。
            - **修复 UDP 丢包率误报 0.000%**：支持 iperf3 的科学计数法百分比输出，只解析 receiver 汇总并用 `lost/total` 重新计算；缺少可信汇总时报告未知，不再用尾部 `0/0 (0%)` 覆盖结果。
            - **保留收尾失败前的有效网卡证据**：iperf3 在结果交换阶段出现 control-message / connection-reset 错误时，只要有效采样窗口充足，性能结论继续依据接收端网卡数据；工具执行状态和错误原因仍完整保留。
            - **新增计数器停滞检测和运行健康提示**：`stalled_ratio` / `COUNTER_STALLED` 区分“采样在线但字节计数不动”；连续零测量会在报告顶部告警，并可通过 `abort_after_dead_traffic_units` 选择自动中止。
            - **负载与链路策略更贴近真实路径**：UDP 默认按发送端/接收端较低链路能力裁剪，Wi-Fi 使用稳定的 payload ceiling；新增 `link_profiles.by_role` 与 `by_nic`，允许按方向分别设置 RX 门限和 UDP 带宽。
            - **长时间运行可追溯性增强**：每个测试单元前重新获取双端网卡，拓扑变化写入任务，网卡消失明确记为 `NIC_DISAPPEARED`；报告和控制台统一显示执行序号，并估算过大 TCP socket buffer 的在途数据。
            - **回归覆盖**：单元测试 337 → 379，新增 WebUI 配置转换、安全边界、参数档位、零任务拒绝，以及 UDP 窗口、丢包、链路裁剪、计数器停滞和报告相关场景。

            ## v4.2.7 判定口径一致性、发送端采样与报告证据

            - **修复 TCP / ctsTraffic 会把「采样不可信」误判成「CPE 不达标」**：这两条路径原先先比对 RX 目标、再检查 5 秒滚动窗口覆盖率，于是「网卡计数器中断后恢复」这类环境异常会被写成 `RATE_FAIL / RX_BELOW_TARGET`。现在采样可信度一律先于任何性能结论，与 UDP 路径顺序一致。
            - **TCP / ctsTraffic 补上发送端网卡采样**：此前只采接收端，验收要求的「有目标时 RX/TX 任一侧滚动覆盖率低于 95% 均为 NOT_EVALUATED」在这两条路径上并未生效，报告里的源网卡 TX 指标也一直是空的。现在两端各起一个采样器（同一块网卡时复用），PASS 条件相应变严。
            - **TCP / CTS 的 resume identity 升版**（`iperf_tcp_v3`、`ctstraffic_v4`）：PASS 条件变严，旧版缓存的 PASS 不能再被 `--resume` 复用，否则会用旧语义的结论冒充新验收。
            - **判定语义收敛到单一实现**：新增 `verdict` 模块统一 `Verdict`、原因码优先级与单元聚合，执行端与报告端不再各写一份（此前两份实现顺序不一致，先后导致过两个静默错判）；并加了源码级结构断言防止再次分叉。
            - **报告新增判定证据**：每行给出判定窗口区间（可直接对到网卡逐样本 CSV 的 `elapsed_ms`）、已扣除的背景速率中位数、5 秒滚动窗口覆盖率；传输列区分 `iperf3 UDP` 与 `ctsTraffic UDP`，两种后端同时出现时提示其 UDP 语义不等价、不应直接互比。
            - **原因码分层**：报告把「下一步该做什么」升为正文（是环境问题、配置问题，还是被测设备确实不达标），原有原因码降级为小字保留，不改动任何码本身。
            - **配置**：新增 `config.minimal.json`（只需改 3 项即可跑通）；配置加载时校验会让 `settle_secs ≥ duration` 这类「静默把每个吞吐单元变成 NOT_EVALUATED」的写法直接报出来。
            - **网卡样本 CSV** 头部新增 `origin_offset_ms` 与 `origin_uncertainty_half_width_ms`，共同窗口卡在边界时可判断是真够还是双机对齐误差凑够的。macOS 上报告会提示网卡采样经由 netstat 子进程、抖动高于 Windows/Linux。
            - CI：ctsTraffic 二进制增加自托管镜像兜底（两条路径都过同一个 SHA-256 门槛）；单元测试 311 → 337，新增 8 个 UDP 编排层场景（U00C/U00D/U00E/U00F/U00G/U01/U02/W09）。

            ## v4.2.6 报告概览截图、UDP 方向日志与测量窗口修复

            - 网卡监控与控制台/CSV 时间戳升级为完整日期时间（如 2026-08-17 12:00:01），跨天长时间监控也能直接定位问题发生的时刻。
            - 双向 UDP 两腿并行时，master.log 的 attempt/retry 日志带 [ab]/[ba] 方向前缀，两条腿的重试记录不再无法区分。
            - 修复 iperf 有效窗口被“补长”：iperf 行内区间是权威来源，短于要求时长也按实际裁剪，不再回退到 client 进程寿命——此前 175 秒短测量会被补成 180 秒完整窗口，并把启动爬升算进接收端平均。
            - 报告概览新增主控/辅测截图缩略图列（点击打开原图，未采集时整列不渲染）；单条流明细显示流量工具自报速率（工具证据，非判定口径），网卡列注明按方向统计见组合计行。
            - 双向判定不再展示“AB + BA 接收端 RX 平均合计”，避免把两个方向接收速率相加误读成整机吞吐；无单元汇总行的旧数据也复刻执行端聚合顺序，单流 UDP 硬失败不被另一方向的 NOT_EVALUATED 掩盖。

            ## v4.2.5 报告可读性、双向汇总与 UDP 语义修复

            - Ping 概览现在明确显示丢包率以及 RTT 最小/平均/最大值，并记录 `PING_OK`；resume 命中记录 `RESUME_FRESH_PASS`，SKIP 不再显示无意义的“不适用”原因。
            - 逐行诊断恢复截图、实际灌包命令、raw log、NIC CSV 和内嵌原始输出入口；报告在桌面与移动端都保留这些附件，并显示真实资源是否加载。
            - 双向单元按 AB/BA 分别展示接收端 RX 平均、RX-P10、目标和原因，另给出 AB + BA RX 平均合计；RX-P10 不相加，判定原因会依据当前展示指标复核。
            - TCP 双向执行行明确为两个方向；UDP 双向区分独立流明细和方向组合计。Windows UDP client 使用 `-b`，并发由独立 client 实现，不使用 `-P`。
            - UDP resume identity 升级为 `iperf_v4`，避免旧统计窗口语义的 PASS 被错误复用。

            ## v4.2.4 时间轴、安全与报告归档修复

            - 修复 iperf client `status()` 的 done=true 快照竞态：先复制事件、再读完成状态的合法并发交错会让主控停止轮询时永久漏掉尾部 `Traffic/Ended` 事件。现在先读完成状态再复制事件，任何已完成 job 的快照都包含全部事件。
            - 修复 start RPC 重试污染远端时间轴：只统计成功那次调用自身的耗时，首次连接超时、重试成功后，远端 job 零点不再被前几次失败的重试等待整体偏移。
            - 远端 monitor 零点改用 start 响应回传的 `elapsed_ms` 做有界估计，不再用 RPC 往返中点猜测；非对称网络延迟不会再把空闲时间混入正式窗口。
            - agent 控制平面加固：支持 `--token` / `agent_token` 共享令牌认证（未认证请求返回 401 且不创建任何资源）和 `--bind` 监听地址收紧；主控在 config.json 配置相同令牌即可连接。
            - 报告、主控日志和全部运行附件按 run 目录归档，报告截图缩略图保留到原图的链接。
            - CI 质量作业（fmt / test / clippy / 配置与文档包校验）扩展到每个 PR 与分支推送，不再只等 tag 或手工触发。

            ## v4.2.2 核心修复（历史）

            - TCP 与 UDP 并发流数可分别通过 `tcp_streams`、`udp_streams` 控制；字段缺省或为 `0` 时分别回退旧字段 `streams`。交互菜单只询问已选协议的流数；iperf3 和 CTS 都使用对应协议的有效流数。
            - UDP 带宽使用完整、严格且大小写不敏感的格式解析。`2.8G` 与 `2.8Gbps` 都规范化为精确的 `2800000000 bit/s`；尾随垃圾、科学计数和混合后缀不再透传给后端。
            - iperf3 保留原生 `-l 14k`，CTS 按 1024 进制转换为 `DatagramByteSize:14336`。14 KiB 超过常见 1500 字节 MTU，会产生 IP 分片。
            - ctsTraffic 接收端 NIC 统计已统一到每条测试腿的时间轴，只计算 `Connected`、有效 `Traffic` 与 `Ended` 事件可以证明的数据窗口。monitor RPC、进程启动、握手、状态轮询、重试等待和清理时间不再拉低平均速率。
            - 不再用 `Total Time`、正常完成或疑似 stdout 缓冲补齐无法证明的数据窗口，也不再在无样本时回退到全生命周期平均速率。证据不足时返回 `NOT_EVALUATED / CTSTRAFFIC_EFFECTIVE_WINDOW_SHORT`，避免把统计假低误判为 `RATE_FAIL`。
            - monitor 启动、停止、无样本及窗口内采样异常分别记录 `CTSTRAFFIC_MONITOR_START_FAILED`、`CTSTRAFFIC_MONITOR_STOP_FAILED`、`CTSTRAFFIC_MONITOR_NO_SAMPLES`、`CTSTRAFFIC_MONITOR_RUNTIME_ERROR`。CTS resume identity 升级为内部 schema `ctstraffic_v2`，不会复用旧统计语义下缓存的 CTS PASS；agent 能力名仍保持 `ctstraffic_v1`。

            ## 文档与部署

            本版补充 Microsoft ctsTraffic 2.0.4.0 x64 的 TCP Push/Pull/Duplex、UDP 单向/双向原生双机手工命令。Windows 包继续捆绑固定并校验过的 ctsTraffic 2.0.4.0 x64；iperf3 仍需按包内说明自行放置。主控和 agent 应完整使用同一个 ${{ github.ref_name }} Release 包。

            自动测试和 Windows 交叉编译不能代替真实网卡、驱动、防火墙及 CPE 环境。发布后仍建议在两台真实 Windows 10+ 设备上完成一次 CTS TCP/UDP 双机数据流验收，重点核对 CTS 自报速率、`sample_coverage`、`effective_seconds`、`nic_samples_*.csv` 和 `CTSTRAFFIC_*` 诊断。

            三个平台归档的 SHA-256 请见 `SHA256SUMS`；Windows 配置文档包请见同名 `.zip.sha256`。
          files: |
            release-assets/cpe_test-${{ github.ref_name }}-windows-x86_64.zip
            release-assets/cpe_test-${{ github.ref_name }}-macos-aarch64.tar.gz
            release-assets/cpe_test-${{ github.ref_name }}-linux-x86_64.tar.gz
            release-assets/SHA256SUMS

      - name: Assert published Release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected=(
            "SHA256SUMS"
            "cpe_test-${tag}-linux-x86_64.tar.gz"
            "cpe_test-${tag}-macos-aarch64.tar.gz"
            "cpe_test-${tag}-windows-x86_64.zip"
          )
          mapfile -t remote < <(gh release view "${tag}" --json assets --jq '.assets[].name' | sort)
          if [[ "${#remote[@]}" -ne "${#expected[@]}" ]]; then
            printf 'published asset count mismatch; expected %s, got %s:\n' "${#expected[@]}" "${#remote[@]}" >&2
            printf '  %s\n' "${remote[@]}" >&2
            exit 1
          fi
          for asset in "${expected[@]}"; do
            if ! printf '%s\n' "${remote[@]}" | grep -Fx -- "${asset}" >/dev/null; then
              echo "published Release is missing expected asset: ${asset}" >&2
              exit 1
            fi
          done

          body="$(gh release view "${tag}" --json body --jq '.body')"
          if [[ -z "${body//[[:space:]]/}" ]]; then
            echo "published Release notes are empty" >&2
            exit 1
          fi

          mkdir -p published-assets
          gh release download "${tag}" --dir published-assets
          mapfile -t downloaded < <(find published-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#downloaded[@]}" -ne "${#expected[@]}" ]]; then
            echo "downloaded published asset count mismatch" >&2
            exit 1
          fi
          cmp release-assets/SHA256SUMS published-assets/SHA256SUMS
          (
            cd published-assets
            sha256sum -c SHA256SUMS
          )
