<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPE 辅测机状态</title>
<style>
/* 辅测机状态页 · 与控制台同一套仪表皮肤。
   这是灌包链路的“另一端”：它没有矩阵、不发起测试，只把自己的运行状态、
   网卡和实时活动亮出来。所以主角是那颗“在用/空闲”指示灯——像仪器面板上
   的 IN-USE 灯。机箱随主题明暗，指示灯与读数用磷光信号色。 */
:root {
  color-scheme:light dark;
  --fu:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  --fm:ui-monospace,"Cascadia Mono","SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --canvas:#d3dade; --surface:#f2f5f7; --panel-2:#e9eef1;
  --ink:#15222b; --muted:#5b6a74; --line:#c1cbd1; --head:#e5ebee;
  --accent:#0e5a6b; --accent-hover:#0a4553; --on-accent:#eefbfd;
  --ok:#12783e; --ok-bg:#dff0e6; --bad:#b3242f; --bad-bg:#f9e5e7;
  --info-bg:#e1ecef; --focus:#c8811a;
  --screen-bg:#081210; --screen-ink:#c9e7dc; --screen-dim:#5f807a;
  --signal:#37e0bd; --bezel:#040d0b; --bezel-hi:rgba(120,190,175,.13); --glow:rgba(55,224,189,.4);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --canvas:#0a0f12; --surface:#141c20; --panel-2:#101a1e;
    --ink:#e7f0f1; --muted:#9cafb5; --line:#2a393f; --head:#19242a;
    --accent:#3fb9ca; --accent-hover:#63cddb; --on-accent:#05161a;
    --ok:#6ecf95; --ok-bg:#143324; --bad:#ff969b; --bad-bg:#3f2128;
    --info-bg:#112f38; --focus:#ffc65c;
  }
}
:root[data-theme="dark"] {
  --canvas:#0a0f12; --surface:#141c20; --panel-2:#101a1e;
  --ink:#e7f0f1; --muted:#9cafb5; --line:#2a393f; --head:#19242a;
  --accent:#3fb9ca; --accent-hover:#63cddb; --on-accent:#05161a;
  --ok:#6ecf95; --ok-bg:#143324; --bad:#ff969b; --bad-bg:#3f2128;
  --info-bg:#112f38; --focus:#ffc65c;
}

* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font-family:var(--fu);
  font-size:14px; line-height:1.5; }
::selection { background:var(--accent); color:var(--on-accent); }
.wrap { width:min(100%,1120px); min-height:100vh; margin:0 auto; background:var(--surface);
  border-inline:1px solid var(--line); }
@media (min-width:760px) { .wrap { animation:boot .5s ease both; } }
@keyframes boot { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

.app-header { padding:20px 24px 16px; display:flex; align-items:center; justify-content:space-between;
  gap:16px 24px; flex-wrap:wrap; border-bottom:1px solid var(--line);
  box-shadow:inset 0 -3px 0 var(--accent); }
.brand { display:flex; flex-direction:column; gap:4px; }
.eyebrow { font:600 11px/1 var(--fm); letter-spacing:.26em; color:var(--accent); text-transform:uppercase; }
h1 { margin:0; font-size:21px; font-weight:700; line-height:1.2; letter-spacing:-.01em; }
.version { display:inline-flex; align-items:center; gap:9px; padding:7px 12px; background:var(--screen-bg);
  border:1px solid var(--bezel); border-radius:5px; color:var(--screen-ink);
  font:12px/1.3 var(--fm); font-variant-numeric:tabular-nums;
  box-shadow:inset 0 0 0 1px var(--bezel-hi); max-width:100%; overflow-wrap:anywhere; }
.version::before { content:""; width:7px; height:7px; flex:0 0 7px; border-radius:50%;
  background:var(--signal); box-shadow:0 0 7px var(--glow); }

section { padding:20px 24px 22px; border-bottom:1px solid var(--line); }
h2 { margin:0 0 14px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:10px; }
h2 .n { display:inline-flex; width:24px; height:22px; flex:0 0 24px; align-items:center; justify-content:center;
  border:1px solid var(--accent); border-radius:3px; background:transparent; color:var(--accent);
  font:700 12px/1 var(--fm); }

button { min-height:34px; padding:7px 15px; border:1px solid var(--accent); border-radius:4px;
  background:var(--accent); color:var(--on-accent); font:600 13px/1.2 var(--fu); cursor:pointer; }
button:hover:not(:disabled) { background:var(--accent-hover); border-color:var(--accent-hover); }
button.ghost { background:var(--surface); color:var(--accent); }
button.ghost:hover:not(:disabled) { background:var(--info-bg); color:var(--accent); }
button:disabled { opacity:.45; cursor:not-allowed; }
button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

.row { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }

table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
td { font-variant-numeric:tabular-nums; }
thead th { position:sticky; top:0; z-index:1; background:var(--head); color:var(--muted);
  font:600 11px/1.3 var(--fm); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
tbody tr:nth-child(even) td { background:color-mix(in srgb, var(--panel-2) 45%, transparent); }
tbody tr:last-child td { border-bottom:0; }
.scroll { max-width:100%; overflow:auto; border:1px solid var(--line); border-radius:5px; background:var(--surface); }
#nics { min-width:760px; }
#acts { min-width:620px; }

.status { padding:9px 12px; border-left:3px solid currentColor; border-radius:0 4px 4px 0; margin-top:10px; }
.status.ok { background:var(--ok-bg); color:var(--ok); }
.status.bad { background:var(--bad-bg); color:var(--bad); }
.status.info { background:var(--info-bg); color:var(--accent); }
.hint { color:var(--muted); font-size:12px; }
.mono { font-family:var(--fm); font-variant-numeric:tabular-nums; }

/* 主状态：一块暗玻璃读数屏，IN-USE 灯是它的主角 */
.big-state { display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px;
  padding:16px 18px; background:var(--screen-bg); border:1px solid var(--bezel); border-radius:7px;
  box-shadow:inset 0 0 0 1px var(--bezel-hi), inset 0 14px 46px rgba(0,0,0,.5); }
.dot { width:14px; height:14px; flex:0 0 14px; border-radius:50%; background:var(--screen-dim); }
.dot.live { background:var(--signal); box-shadow:0 0 10px var(--glow); }
.dot.idle { background:var(--focus); box-shadow:0 0 10px rgba(200,129,26,.5); }
.state-text { flex:1 1 auto; min-width:0; font:600 16px/1.35 var(--fu); color:var(--screen-ink); }
.big-state button { flex:0 0 auto; }

.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px 18px; margin-top:14px; }
.fact { border-left:3px solid var(--line); padding:3px 0 3px 11px; }
.fact dt { margin:0; color:var(--muted); font:600 11px/1.4 var(--fm); letter-spacing:.06em; text-transform:uppercase; }
.fact dd { margin:1px 0 0; font-family:var(--fm); overflow-wrap:anywhere; }
.fact.warn { border-left-color:var(--bad); }
.fact.warn dd { color:var(--bad); }

.tag { padding:1px 8px; border:1px solid var(--line); border-radius:10px; font:11px/1.4 var(--fm); color:var(--muted); }
.tag.used { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); font-weight:700; }
td.act-count { text-align:right; font-variant-numeric:tabular-nums; }
td.act-bad { color:var(--bad); font-weight:700; }
.empty { padding:16px 10px; color:var(--muted); }

@media (max-width:760px) {
  .wrap { border:0; }
  .app-header, section { padding-inline:14px; }
  .app-header { align-items:flex-start; }
  .version { width:100%; }
}
@media (prefers-reduced-motion:reduce) {
  * { scroll-behavior:auto !important; animation:none !important; }
}
</style>
</head><body>
<div class="wrap">
  <header class="app-header">
    <div class="brand">
      <span class="eyebrow">灌包链路 · 辅测端</span>
      <h1>CPE 辅测机状态</h1>
    </div>
    <span class="version" id="ver">LOCAL · 127.0.0.1</span>
  </header>

  <section>
    <h2><span class="n">1</span>运行状态</h2>
    <div class="big-state">
      <span class="dot" id="dot"></span>
      <span class="state-text" id="state">读取中…</span>
      <button type="button" id="refresh" class="ghost">重新扫描</button>
    </div>
    <div id="scanmsg"></div>
    <dl class="facts" id="facts"></dl>
    <div id="warn"></div>
  </section>

  <section>
    <h2><span class="n">2</span>本机网卡</h2>
    <div class="scroll">
      <table id="nics">
        <thead><tr><th>网卡</th><th>角色</th><th>IPv4</th><th>IPv6</th><th>网关</th><th>协商速率</th></tr></thead>
        <tbody><tr><td colspan="6" class="empty">读取中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2><span class="n">3</span>实时活动</h2>
    <div class="scroll">
      <table id="acts">
        <thead><tr><th>时间</th><th>来自</th><th>动作</th><th>接口</th><th>次数</th></tr></thead>
        <tbody><tr><td colspan="5" class="empty">还没有收到主控的请求。</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function api(path) {
  const r = await fetch(path, { headers: { 'Accept': 'application/json' } });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j.data;
}

let PEER = null;

function fact(label, value, warn) {
  return '<div class="fact' + (warn ? ' warn' : '') + '"><dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd></div>';
}

function hhmmss(secs) {
  const s = Math.max(0, Math.floor(secs));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? h + ' 小时 ' + m + ' 分' : m > 0 ? m + ' 分' : s + ' 秒';
}

function renderStatus(d) {
  $('ver').textContent = 'v' + d.version + ' · ' + d.hostname + ' · ' + d.os;
  const facts = [
    fact('监听地址', d.bind + ':' + d.port),
    fact('已运行', hhmmss(d.uptime_secs)),
    fact('访问令牌', d.token_configured ? '已启用（主控需填相同 token）' : '未启用', !d.token_configured),
    fact('iperf3', d.iperf3 ? d.iperf3 : '未找到', !d.iperf3),
  ];
  $('facts').innerHTML = facts.join('');

  const warns = [];
  if (!d.iperf3) {
    warns.push('没找到 iperf3：Ping 还能用，但灌包测试会全部失败。把 iperf3 可执行文件放到本程序同目录后重启本程序。');
  }
  if (!d.token_configured) {
    warns.push('未启用访问令牌：任何能访问 ' + d.port + ' 端口的机器都能控制本机。隔离测试网里可以这样用；否则请用 --token 启动，并让主控填相同的值。');
  }
  $('warn').innerHTML = warns.map((w) => '<div class="status bad">' + esc(w) + '</div>').join('');

  renderNics(d.nics.interfaces || []);
}

function renderNics(interfaces) {
  const rows = interfaces.map((n) => '<tr><td class="mono">' + esc(n.name) + '</td><td>' + esc(n.role) +
    '</td><td class="mono">' + esc(n.ipv4 || '—') +
    (PEER && PEER === n.ipv4 ? ' <span class="tag used">主控在用</span>' : '') +
    '</td><td class="mono">' + esc(n.ipv6_global || n.ipv6_ll || '—') +
    '</td><td class="mono">' + esc(n.gateway_v4 || '—') + '</td><td class="mono">' +
    (n.speed_mbps ? n.speed_mbps + ' Mbps' : '—') + '</td></tr>');
  $('nics').querySelector('tbody').innerHTML = rows.length ? rows.join('')
    : '<tr><td colspan="6" class="empty">没有扫到网卡。检查网线 / Wi-Fi 是否连上，再点「重新扫描」。</td></tr>';
}

function renderActivity(d) {
  const before = PEER;
  PEER = d.peer || null;

  const dot = $('dot'), state = $('state');
  if (d.idle_secs == null) {
    dot.className = 'dot';
    state.textContent = 'agent 已就绪，等待主控连接';
  } else if (d.idle_secs <= 20) {
    dot.className = 'dot live';
    state.textContent = '主控 ' + d.peer + ' 正在使用本机';
  } else {
    dot.className = 'dot idle';
    state.textContent = '空闲中 · 上次请求来自 ' + d.peer + '（' + hhmmss(d.idle_secs) + '前）';
  }

  const rows = (d.entries || []).slice().reverse().map((e) =>
    '<tr><td class="mono">' + esc(e.time) + '</td><td class="mono">' + esc(e.peer) +
    '</td><td' + (e.ok ? '' : ' class="act-bad"') + '>' + esc(e.label) + (e.ok ? '' : '（失败）') +
    '</td><td class="mono">' + esc(e.path) + '</td><td class="act-count mono">' +
    (e.count > 1 ? '×' + e.count : '') + '</td></tr>');
  $('acts').querySelector('tbody').innerHTML = rows.length ? rows.join('')
    : '<tr><td colspan="5" class="empty">还没有收到主控的请求。</td></tr>';

  // 主控换了地址（或第一次连上）时把网卡表重画一遍，好标出它用的是哪一块。
  if (before !== PEER && LAST_INTERFACES.length) renderNics(LAST_INTERFACES);
}

let LAST_INTERFACES = [];

function scanMsg(text, kind) {
  $('scanmsg').innerHTML = text ? '<div class="status ' + kind + '">' + esc(text) + '</div>' : '';
}

// manual=true 是人点了「重新扫描」。这条路径必须有可见反馈：Windows 上
// scan_host 要起 ipconfig/netsh，一两秒里页面纹丝不动，而扫完通常和扫之前
// 长得一模一样——没有反馈的话，成功和没反应在屏幕上是同一个样子。
async function loadStatus(manual) {
  const btn = $('refresh');
  if (manual) {
    btn.disabled = true;
    btn.textContent = '扫描中…';
    scanMsg('正在重新扫描网卡…', 'info');
  }
  try {
    const d = await api('/api/status');
    LAST_INTERFACES = d.nics.interfaces || [];
    renderStatus(d);
    if (manual) {
      scanMsg('已重新扫描 · ' + LAST_INTERFACES.length + ' 块网卡 · ' + new Date().toLocaleTimeString(), 'ok');
    }
  } catch (e) {
    // 手动扫描的失败写在按钮旁边，不去覆盖「运行状态」那一行：那一行归
    // renderActivity 管，被覆盖后要等下一次 60 秒兜底轮询才恢复。
    if (manual) {
      scanMsg('扫描失败：' + e.message, 'bad');
    } else {
      $('state').textContent = '读取状态失败：' + e.message;
      $('dot').className = 'dot';
    }
  } finally {
    if (manual) {
      btn.disabled = false;
      btn.textContent = '重新扫描';
    }
  }
}

async function loadActivity() {
  try { renderActivity(await api('/api/activity')); } catch (e) { /* 下一轮再试 */ }
}

$('refresh').onclick = () => loadStatus(true);

loadStatus();
loadActivity();
// 活动是纯内存读取，轮询很便宜；状态要重扫网卡（Windows 上要起 ipconfig/netsh），
// 所以只在打开页面、点「重新扫描」和每 60 秒兜底刷新时才拉。
setInterval(loadActivity, 1500);
setInterval(() => loadStatus(), 60000);
</script>
</body></html>
